<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Economia - ZN Solar</title>
  <!-- Chart.js para os Gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- html2pdf.js para Geração do PDF da Proposta -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- FontAwesome para Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 900px;
      width: 100%;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      color: #ff9800;
      margin-top: 0;
      font-size: 2rem;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 1rem;
    }

    /* ====== AJUSTE DE TELA RESPONSIVO (SEM ESTOURO) ====== */
    .linha-tarifas {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 25px;
      background: #fdfdfd;
      padding: 15px;
      border-radius: 8px;
      border: 1px dashed #ff9800;
      box-sizing: border-box;
    }

    .campo-tarifa {
      flex: 1;
      min-width: 130px;
      display: flex;
      flex-direction: column;
    }

    .campo-tarifa label {
      font-weight: bold;
      font-size: 0.78rem;
      color: #444;
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .campo-tarifa input, .campo-tarifa select {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.85rem;
      width: 100%;
      box-sizing: border-box;
    }

    .grid-meses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .campo-mes {
      display: flex;
      flex-direction: column;
    }

    .campo-mes label {
      font-weight: 500;
      font-size: 0.9rem;
      color: #333;
      margin-bottom: 5px;
    }

    .campo-mes input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    .btn-calcular {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-calcular:hover {
      background: #1b5e20;
    }

    #resultado {
      margin-top: 30px;
      display: none;
    }

    /* Estilos ocultos para formatação interna do PDF impresso */
    .pdf-header { display: none; text-align: center; margin-bottom: 20px; }
    .pdf-header h1 { color: #ff9800; margin: 0; }
  </style>
</head>
<body>

  <div class="container" id="conteudo-simulador">
    <!-- Cabeçalho Oculto na Web que só aparece no PDF -->
    <div class="pdf-header" id="pdf-topo">
      <h1>ZN SOLAR</h1>
      <p style="color:#555; font-size:12px; margin:5px 0;">Soluções em Energia Renovável | Proposta de Dimensionamento Prévio</p>
      <hr style="border:0; border-top:2px solid #ff9800;">
    </div>

    <h2>Simule seu Sistema e Economia</h2>
    <p class="subtitulo">Configure as tarifas da sua conta e insira o consumo em kWh dos últimos 12 meses.</p>

    <!-- LINHA DE TARIFAS TÉCNICAS RECONFIGURADAS -->
    <div class="linha-tarifas">
      <div class="campo-tarifa">
        <label>Tipo Consumo</label>
        <select id="tipoConsumo">
          <option value="B1">B1 (Residencial)</option>
          <option value="B2">B2 (Rural)</option>
          <option value="B3">B3 (Comercial/Outros)</option>
          <option value="A">Grupo A (Industrial)</option>
        </select>
      </div>
      
      <!-- SELETOR DINÂMICO DE LIGAÇÃO -->
      <div class="campo-tarifa">
        <label>Tipo de Ligação</label>
        <select id="ligacao">
          <option value="30">Monofásico (30 kWh)</option>
          <option value="50" selected>Bifásico (50 kWh)</option>
          <option value="100">Trifásico (100 kWh)</option>
        </select>
      </div>

      <div class="campo-tarifa">
        <label>Tarifa TE (R$)</label>
        <input type="number" id="tarifaTE" step="0.00001" value="0.43500">
      </div>

      <div class="campo-tarifa">
        <label>Tarifa TUSD (R$)</label>
        <input type="number" id="tarifaTUSD" step="0.00001" value="0.49454">
      </div>

      <div class="campo-tarifa">
        <label>Ilum. Pública (R$)</label>
        <input type="number" id="tarifaCosip" step="0.01" value="9.39">
      </div>

      <div class="campo-tarifa">
        <label>Bandeira Cor</label>
        <select id="bandeiraCor" onchange="atualizarCorBandeira(this)">
          <option value="verde" style="color:green;">Verde</option>
          <option value="amarela" style="color:orange;">Amarela</option>
          <option value="vermelha" style="color:red;">Vermelha</option>
        </select>
      </div>

      <div class="campo-tarifa">
        <label>Valor Band. (R$)</label>
        <input type="number" id="tarifaBandeira" step="0.00001" value="0.00000">
      </div>
    </div>

    <!-- ENTRADA DE HISTÓRICO DOS 12 MESES -->
    <div class="grid-meses">
      <div class="campo-mes"><label>Mês Atual (kWh)</label><input type="number" class="mes-input" value="350"></div>
      <div class="campo-mes"><label>2º mês (kWh)</label><input type="number" class="mes-input" value="320"></div>
      <div class="campo-mes"><label>3º mês (kWh)</label><input type="number" class="mes-input" value="340"></div>
      <div class="campo-mes"><label>4º mês (kWh)</label><input type="number" class="mes-input" value="280"></div>
      <div class="campo-mes"><label>5º mês (kWh)</label><input type="number" class="mes-input" value="260"></div>
      <div class="campo-mes"><label>6º mês (kWh)</label><input type="number" class="mes-input" value="250"></div>
      <div class="campo-mes"><label>7º mês (kWh)</label><input type="number" class="mes-input" value="240"></div>
      <div class="campo-mes"><label>8º mês (kWh)</label><input type="number" class="mes-input" value="290"></div>
      <div class="campo-mes"><label>9º mês (kWh)</label><input type="number" class="mes-input" value="310"></div>
      <div class="campo-mes"><label>10º mês (kWh)</label><input type="number" class="mes-input" value="330"></div>
      <div class="campo-mes"><label>11º mês (kWh)</label><input type="number" class="mes-input" value="360"></div>
      <div class="campo-mes"><label>12º mês (kWh)</label><input type="number" class="mes-input" value="380"></div>
    </div>

    <button class="btn-calcular" onclick="_calcZN()">Calcular Dimensões e Economia</button>

    <!-- ÁREA DE EXIBIÇÃO DE RESULTADOS -->
    <div id="resultado"></div>
  </div>

  <script>
    // Tabela Comercial ZN Solar
    const _0xtp = {
      "2.0": 9568, "2.5": 11250, "3.0": 12900, "3.5": 14500, "4.0": 16100,
      "4.5": 17800, "5.0": 19400, "5.5": 21100, "6.0": 22700, "7.0": 25800,
      "8.0": 28900, "9.0": 32100, "10.0": 35200, "12.0": 41500, "15.0": 50800,
      "20.0": 66200, "25.0": 81500, "30.0": 96800, "40.0": 121500, "50.0": 143100,
      "60.0": 167500, "75.0": 198000
    };

    let globalConfig = {};

    function atualizarCorBandeira(select) {
      const valorInput = document.getElementById('tarifaBandeira');
      if (select.value === 'verde') valorInput.value = "0.00000";
      else if (select.value === 'amarela') valorInput.value = "0.02989";
      else if (select.value === 'vermelha') valorInput.value = "0.07877";
    }

    function _calcZN() {
      const divResultado = document.getElementById('resultado');
      const inputs = document.querySelectorAll('.mes-input');
      
      let totalKwh = 0;
      let listaValores = [];
      inputs.forEach(input => {
        let v = parseFloat(input.value) || 0;
        totalKwh += v;
        listaValores.push(v);
      });

      const nomesMeses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

      // CAPTURA DOS PARÂMETROS
      const tipoConsumo = document.getElementById('tipoConsumo').value;
      const kwhDisponibilidade = parseFloat(document.getElementById('ligacao').value); 
      const tTE = parseFloat(document.getElementById('tarifaTE').value) || 0;
      const tTUSD = parseFloat(document.getElementById('tarifaTUSD').value) || 0;
      const tCosip = parseFloat(document.getElementById('tarifaCosip').value) || 0;
      const tBandeira = parseFloat(document.getElementById('tarifaBandeira').value) || 0;

      const tarifaTotalComBandeira = tTE + tTUSD + tBandeira;
      const c = totalKwh / 12; 
      
      // Conta Mensal Cheia (Sem Solar) com COSIP inclusa
      const tc = (c * tarifaTotalComBandeira) + tCosip;

      // Dimensionamento técnico com margem de segurança de 18% integrada
      const pr = ((c * 1.22) / 55.42) * 0.575;
      
      let pf;
      const ehExato = (pr % 1 === 0) || (Math.abs(pr % 1 - 0.5) < 0.0001);
      if (ehExato) { pf = pr; } else {
          const baseInteira = Math.floor(pr); 
          const restoDecimal = pr - baseInteira; 
          if (restoDecimal < 0.5) { pf = baseInteira; } else { pf = baseInteira + 1.0; }
      }

      if (totalKwh < 2 || pf < 2.0) pf = 2.0;
      if (pf > 75.0) pf = 75.0;

      const n = Math.ceil(pf / 0.575);
      const a = (n * 2.58) * 1.15;

      // Conta Fina Pós-Solar considerando a taxa mínima selecionada
      const novaContaFixo = (kwhDisponibilidade * tarifaTotalComBandeira) + tCosip;
      const economiaMensal = tc - novaContaFixo;

      const p = _0xtp[pf.toFixed(1)] || _0xtp[pf] || 0;
      const payback = (economiaMensal > 0) ? (p / (economiaMensal * 12)).toFixed(1) : 0;

      // Salvando configurações para o escopo global
      let rotuloLigacao = kwhDisponibilidade === 30 ? "Monofásico" : kwhDisponibilidade === 50 ? "Bifásico" : "Trifásico";
      globalConfig = { tipoConsumo, rotuloLigacao, p, payback };

      const hspSP = [5.22, 5.48, 4.70, 4.14, 3.42, 3.17, 3.24, 4.20, 4.24, 4.76, 5.14, 5.69];
      const dadosGeracao = hspSP.map(hsp => n * 0.575 * hsp * 30 * 0.76);
      const mediaGeracao = dadosGeracao.reduce((x, y) => x + y, 0) / 12;

      let tabelaMesesWhats = `📅 *HISTÓRICO DE CONSUMO vs GERAÇÃO:*\n`;
      tabelaMesesWhats += `_Mês | Consumo | Geração Estimada_\n`;
      tabelaMesesWhats += `----------------------------------\n`;
      for (let i = 0; i < 12; i++) {
          tabelaMesesWhats += `• ${nomesMeses[i]}: ${listaValores[i].toFixed(0)} kWh  ➔  ${dadosGeracao[i].toFixed(0)} kWh\n`;
      }
      tabelaMesesWhats += `----------------------------------`;

      const textoWhatsappCliente = `Olá ZNSolar! Seguem os dados da minha Simulação de Energia Solar (${tipoConsumo}):\n----------------------------------\n💰 *INVESTIMENTO E RETORNO:*\n• Investimento Total: R$ ${p.toLocaleString('pt-BR', {minimumFractionDigits: 2})}\n• Retorno Estimado: ${payback} anos\n• Economia Mensal: R$ ${economiaMensal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}/mês\n\n📊 *MÉDIAS DO SISTEMA:*\n• Consumo Médio: ${c.toFixed(1)} kWh/mês\n• Geração Média: ${mediaGeracao.toFixed(1)} kWh/mês\n• Área Necessária: ${a.toFixed(1)} m²\n----------------------------------\n${tabelaMesesWhats}\n\nDesejo mais informações sobre esta simulação e orçamento._`;
      const msgWhatsapp = encodeURIComponent(textoWhatsappCliente);

      divResultado.style.background = "transparent";
      divResultado.style.padding = "0";

      divResultado.innerHTML = `
          <div style="font-size:1.1rem;font-weight:bold;margin-bottom:10px;">Resultado da Simulação ZN Solar (${tipoConsumo}):</div>
          <strong>Consumo Médio Apurado:</strong> ${c.toFixed(1)} kWh/mês<br>
          <strong>Área Necessária Estimada:</strong> ${a.toFixed(1)} m²<br>
          <hr style="border:0;border-top:1px solid #eee;margin:12px 0;">
          
          <strong>Conta Sem Sistema Solar (Cheia):</strong> R$ ${tc.toLocaleString('pt-BR',{minimumFractionDigits:2})} /mês<br>
          <strong>Nova Conta Estimada (Custo Fixo ${rotuloLigacao}):</strong> R$ ${novaContaFixo.toLocaleString('pt-BR',{minimumFractionDigits:2})} /mês<br>
          <strong>Economia Mensal Estimada:</strong> <span style="color:#1b5e20;font-weight:bold;">R$ ${economiaMensal.toLocaleString('pt-BR',{minimumFractionDigits:2})} /mês</span>
          
          <div style="position: relative; height:250px; width:100%; margin: 20px 0;"><canvas id="graficoConsumoMensal"></canvas></div>
          <div style="position: relative; height:180px; width:100%; margin: 20px 0;"><canvas id="graficoCustoFinanceiro"></canvas></div>

          <div style="font-size:1.1rem;font-weight:bold;">Investimento Total Estimado:</div>
          <span style="font-size:1.6rem;font-weight:bold;color:#ff9800;">R$ ${p.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span><br>
          <p><strong>Tempo de Retorno (Payback Estimado):</strong> ${payback} anos</p>

          <div id="projecao-financeira-web" style="margin-top: 25px; margin-bottom: 25px; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e1e8ed;">
              <h3 style="text-align: center; color: #2c3e50; font-size: 18px; margin-top: 0; margin-bottom: 25px; font-weight: bold; border-bottom: 2px solid #eee; padding-bottom: 10px;">Projeção de Economia e Valorização sobre 25 Anos</h3>
              <div id="web-bar-economia" style="display: flex; flex-direction: column; gap: 8px;"></div>
              <div id="web-bar-valorizacao" style="display: flex; flex-direction: column; gap: 8px;"></div>
          </div>
                 
          <button id="btn-pdf-trigger" onclick="gerarPDFProposta()" style="margin-top:20px; background:#e74c3c; color:white; padding:15px; border-radius:5px; font-weight:bold; width:100%; border:none; cursor:pointer;">
              <i class="fas fa-file-pdf"></i> Baixar Proposta em PDF
          </button>

          <a id="btn-whats-trigger" href="https://wa.me/5511983185337?text=${msgWhatsapp}" target="_blank" style="display:block; background:#25d366; color:white; padding:12px; border-radius:5px; text-decoration:none; font-weight:bold; margin-top:12px; text-align:center;">
              Falar no WhatsApp Agora  
          </a>
          <br><small>* O valor acima inclui equipamentos, instalação profissional completa e homologação técnica. Valores baseados nas tarifas customizadas inseridas no simulador.</small><br><br>
          <strong>Aviso Importante:</strong> Este orçamento e simulação são prévios. Visita técnica valor R$ 150,00 para efetivar condições do local da instalação. Ressalvas a parte elétrica do imóvel, se necessário alterações, o valor é cobrado a parte.
      `;

      divResultado.style.display = "block";

      const ctx1 = document.getElementById('graficoConsumoMensal').getContext('2d');
      new Chart(ctx1, {
          type: 'bar',
          data: {
              labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez', 'MÉDIA'],
              datasets: [
                  { label: 'Consumo', data: [...listaValores, c], backgroundColor: '#e53935' },
                  { label: 'Geração', data: [...dadosGeracao, mediaGeracao], backgroundColor: '#2e7d32' }
              ]
          },
          options: { responsive: true, maintainAspectRatio: false }
      });

      const ctx2 = document.getElementById('graficoCustoFinanceiro').getContext('2d');
      new Chart(ctx2, {
          type: 'bar',
          data: {
              labels: ['Conta Sem Solar', `Mínimo (${rotuloLigacao})`],
              datasets: [{
                  label: 'Custo Mensal (R$)',
                  data: [tc, novaContaFixo], 
                  backgroundColor: ['#DC3545', '#28A745'],
                  borderWidth: 1
              }]
          },
          options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } }
          }
      });

      const divWebEconomia = document.getElementById('web-bar-economia');
      const divWebValorizacao = document.getElementById('web-bar-valorizacao');

      if (divWebEconomia && divWebValorizacao) {
          const anosProjecao = [1, 5, 10, 15, 20, 25];
          const taxaReajusteAnual = 0.04;

          let valorMaximoRendimento = 0;
          let economiaMensalAnoAtual = economiaMensal;
          for (let ano = 1; ano <= 25; ano++) {
              for (let mes = 1; mes <= 12; mes++) {
                  valorMaximoRendimento = (valorMaximoRendimento + economiaMensalAnoAtual) * (1 + 0.01);
              }
              economiaMensalAnoAtual = economiaMensalAnoAtual * (1 + taxaReajusteAnual);
          }
          const tetoEscala = Math.round(valorMaximoRendimento);

          let htmlGeral = `
              <div style="margin-bottom: 20px; padding: 12px; background: #f8fafc; border-left: 4px solid #0284c7; font-size: 13px; color: #334155; text-align: left; line-height: 1.4;">
                  <strong>📊 Nota Técnico-Comercial:</strong> Projeções baseadas na ligação de custo mínimo do padrão <strong>${rotuloLigacao}</strong>.
              </div>
          `;

          htmlGeral += `<div style="margin-bottom: 25px;"><h4 style="margin: 0 0 10px 0; font-size: 14px; color: #b91c1c;">🔴 Custo da Conta de Luz Acumulada (Sem Solar)</h4>`;
          anosProjecao.forEach(ano => {
              let custoAcumulado = 0;
              let contaAnoAtual = tc;
              for (let i = 1; i <= ano; i++) {
                  custoAcumulado += contaAnoAtual * 12;
                  contaAnoAtual = contaAnoAtual * (1 + taxaReajusteAnual);
              }
              custoAcumulado = Math.round(custoAcumulado);
              const percentualBarra = tetoEscala > 0 ? Math.min((custoAcumulado / tetoEscala) * 100, 100) : 0;
              htmlGeral += `
                  <div style="display: flex; align-items: center; margin-bottom: 6px;">
                      <div style="width: 55px; font-size: 11px; color: #555; font-weight: bold;">${ano} ${ano === 1 ? 'Ano' : 'Anos'}</div>
                      <div style="flex: 1; background: #e1e8ed; height: 14px; border-radius: 3px; overflow: hidden; margin: 0 10px;">
                          <div style="background: #ef4444; width: ${percentualBarra}%; height: 100%;"></div>
                      </div>
                      <div style="width: 95px; text-align: right; font-size: 11px; font-weight: bold; color: #333;">R$ ${custoAcumulado.toLocaleString('pt-BR')}</div>
                  </div>`;
          });
          htmlGeral += `</div>`;

          htmlGeral += `<div style="margin-bottom: 25px;"><h4 style="margin: 0 0 10px 0; font-size: 14px; color: #1565C0;">🔵 Economia Real Acumulada</h4>`;
          anosProjecao.forEach(ano => {
              let economyPuraAcumulada = 0;
              let economiaAnoAtual = economiaMensal;
              for (let i = 1; i <= ano; i++) {
                  economyPuraAcumulada += economiaAnoAtual * 12;
                  economiaAnoAtual = economiaAnoAtual * (1 + taxaReajusteAnual);
              }
              economyPuraAcumulada = Math.round(economyPuraAcumulada);
              const percentualBarra = tetoEscala > 0 ? Math.min((economyPuraAcumulada / tetoEscala) * 100, 100) : 0;
              htmlGeral += `
                  <div style="display: flex; align-items: center; margin-bottom: 6px;">
                      <div style="width: 55px; font-size: 11px; color: #555; font-weight: bold;">${ano} ${ano === 1 ? 'Ano' : 'Anos'}</div>
                      <div style="flex: 1; background: #e1e8ed; height: 14px; border-radius: 3px; overflow: hidden; margin: 0 10px;">
                          <div style="background: #1565C0; width: ${percentualBarra}%; height: 100%;"></div>
                      </div>
                      <div style="width: 95px; text-align: right; font-size: 11px; font-weight: bold; color: #333;">R$ ${economyPuraAcumulada.toLocaleString('pt-BR')}</div>
                  </div>`;
          });
          htmlGeral += `</div>`;

          divWebEconomia.innerHTML = htmlGeral;

          let htmlRendimento = `<h4 style="margin: 0 0 10px 0; font-size: 14px; color: #2E7D32;">🟢 Valorização Real do Capital Aplicado (Rendimento 1% a.m.)</h4>`;
          anosProjecao.forEach(ano => {
              let capitalAcumuladoComJuros = 0;
              let economiaAnoAtual = economiaMensal;
              for (let i = 1; i <= ano; i++) {
                  for (let m = 1; m <= 12; m++) {
                      capitalAcumuladoComJuros = (capitalAcumuladoComJuros + economiaAnoAtual) * (1 + 0.01);
                  }
                  economiaAnoAtual = economiaAnoAtual * (1 + taxaReajusteAnual);
              }
              capitalAcumuladoComJuros = Math.round(capitalAcumuladoComJuros);
              const percentualBarra = tetoEscala > 0 ? Math.min((capitalAcumuladoComJuros / tetoEscala) * 100, 100) : 0;
              htmlRendimento += `
                  <div style="display: flex; align-items: center; margin-bottom: 6px;">
                      <div style="width: 55px; font-size: 11px; color: #555; font-weight: bold;">${ano} ${ano === 1 ? 'Ano' : 'Anos'}</div>
                      <div style="flex: 1; background: #e1e8ed; height: 14px; border-radius: 3px; overflow: hidden; margin: 0 10px;">
                          <div style="background: #2E7D32; width: ${percentualBarra}%; height: 100%;"></div>
                      </div>
                      <div style="width: 95px; text-align: right; font-size: 11px; font-weight: bold; color: #333;">R$ ${capitalAcumuladoComJuros.toLocaleString('pt-BR')}</div>
                  </div>`;
          });
          divWebValorizacao.innerHTML = htmlRendimento;
      }
    }

    // FUNÇÃO COMPLETA DE EXPORTAÇÃO PARA PDF
    function gerarPDFProposta() {
      const elementoAlvo = document.getElementById('conteudo-simulador');
      const topoPdf = document.getElementById('pdf-topo');
      const btnPdf = document.getElementById('btn-pdf-trigger');
      const btnWhats = document.getElementById('btn-whats-trigger');

      // Torna visível o cabeçalho comercial no PDF
      topoPdf.style.display = 'block';
      if (btnPdf) btnPdf.style.display = 'none';
      if (btnWhats) btnWhats.style.display = 'none';

      const nomeArquivo = `Proposta_ZN_Solar_${globalConfig.tipoConsumo || 'Simulacao'}.pdf`;

      const opcoes = {
        margin:       [10, 10, 10, 10],
        filename:     nomeArquivo,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opcoes).from(elementoAlvo).save().then(() => {
        // Restaura a exibição original do site após salvar
        topoPdf.style.display = 'none';
        if (btnPdf) btnPdf.style.display = 'block';
        if (btnWhats) btnWhats.style.display = 'block';
      }).catch(err => {
        console.error("Erro na geração do PDF: ", err);
        topoPdf.style.display = 'none';
        if (btnPdf) btnPdf.style.display = 'block';
        if (btnWhats) btnWhats.style.display = 'block';
      });
    }
  </script>
