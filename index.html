<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZN Solar - Especialistas em Projetos Fotovoltaicos</title>
  <style>
    /* Estilos Gerais */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
      background-color: #f9f9f9;
    }
    header {
      background-color: #ff9800;
      padding: 20px;
      text-align: center;
    }
    header img {
      max-width: 250px;
      height: auto;
    }
    .hero-subtitle {
      color: white;
      font-size: 1.1em;
      margin-top: 10px;
      font-weight: 500;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Seção do Diagrama Técnico */
    .diagrama-container {
      margin-top: 50px;
      margin-bottom: 50px;
      text-align: center;
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .diagrama-container h2 {
      color: #333;
      margin-bottom: 10px;
    }
    .diagrama-container p {
      color: #666;
      margin-bottom: 25px;
    }
    .diagrama-imagem {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid #ddd;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-top: 20px;
    }

    /* Seção de Contato */
    .contato {
      background-color: #f4f6f8;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      margin-top: 40px;
    }
    .btn-whatsapp {
      background-color: #25d366;
      color: white;
      padding: 15px 30px;
      text-decoration: none;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 5px;
      display: inline-block;
      margin-top: 15px;
      transition: background-color 0.3s;
    }
    .btn-whatsapp:hover {
      background-color: #128c7e;
    }
  </style>
</head>
<body>

  <header>
    <img src="img/marca dagua.png" alt="ZN Solar">
    <div class="hero-subtitle">Energia Solar Fotovoltaica • Economia • Sustentabilidade</div>
  </header>

  <main>
    <section class="diagrama-container">
      <h2>Esquema do Sistema Fotovoltaico</h2>
      <p>Entenda o funcionamento do sistema e a ligação com a rede elétrica.</p>
      <img src="img/Sistemas-on-grid-x-off-grid.jpg" alt="Diagrama Técnico On-Grid vs Off-Grid" class="diagrama-imagem">
    </section>

    <section class="contato">
      <h2>Fale com um Especialista</h2>
      <p>Tem dúvidas sobre o seu projeto? Entre em contacto connosco diretamente pelo WhatsApp.</p>
      <a href="https://wa.me/SeuNumeroAqui" class="btn-whatsapp" target="_blank">Falar no WhatsApp</a>
    </section>
  </main>

</body>
</html>
