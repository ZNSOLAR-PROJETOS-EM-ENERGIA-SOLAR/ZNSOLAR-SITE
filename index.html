    <title>ZNSOLAR | Energia Solar Fotovoltáica em São Paulo</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
      * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; -webkit-user-select:none; user-select:none; }
      body { background:#f7f7f7; color:#333; line-height:1.6; text-align:center; }
      input { -webkit-user-select:auto; user-select:auto; }
  
      header { background:#ffffff; padding:25px 10%; display:flex; flex-direction:column; align-items:center; box-shadow:0 4px 6px rgba(0,0,0,0.05); border-bottom: 1px solid #eee; }
      .logo-site { max-width:300px; height:auto; }
      main { max-width:1200px; margin:0 auto; padding:40px 10%; }
      
      .grid-consumo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
      .campo-mes label { font-weight:bold; font-size:0.85rem; display:block; margin-bottom:5px; }
      .campo-mes input { width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; text-align:center; }

      #resultado-simulacao { 
        margin-top:25px; 
        background: white; 
        padding: 20px; 
        border-radius: 10px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      }

      .aviso-importante-caixa { 
        text-align: justify; 
        font-size: 0.85rem; 
        color: #222; 
        background: #fff3e0; 
        padding: 20px; 
        border: 2px solid #ff9800; 
        margin-top: 20px; 
        line-height: 1.5;
        text-transform: uppercase;
      }
      
      @media (max-width: 600px) { .grid-consumo { grid-template-columns: repeat(2, 1fr); } }
      footer { background:#333; color:white; padding:20px; margin-top:40px; }
      .btn-calc { background:#ff9800; color:white; border:none; padding:18px; width:100%; border-radius:6px; font-size:1.2rem; font-weight:bold; cursor:pointer; transition: 0.3s; }
      .btn-calc:hover { background: #e68a00; }
    </style>
</head>

<body>

<header>
    <img src="img/marca dagua.png" alt="Logotipo ZNSOLAR" class="logo-site">
    <p>Energia Solar Fotovoltaica • Economia • Sustentabilidade</p>
</header>

<main>
    <section id="simulador-solar" style="max-width:850px; margin:0 auto; background:white; padding:30px; border-radius:10px; border-top:4px solid #ff9800; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
        <h2 style="color:#ff9800; margin-bottom:20px;">SIMULADOR DE ECONOMIA ZNSOLAR</h2>
        <p style="margin-bottom:20px; color:#666;">Insira o consumo em kWh dos últimos 12 meses:</p>
        
        <div class="grid-consumo" id="grid-meses"></div>

        <button onclick="_calcZN()" class="btn-calc">GERAR ORÇAMENTO COMPLETO</button>

        <div id="resultado-simulacao" style="display:none;"></div>
    </section>
</main>

<footer>
    <p>&copy; <span id="ano"></span> ZNSOLAR — Energia Solar Fotovoltaica</p>
</footer>

<script>
    // 1. GERAR A GRADE DE MESES DINAMICAMENTE
    const mesesNomes = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
    const gridDiv = document.getElementById('grid-meses');
    const hoje = new Date();
    for (let i = 0; i < 12; i++) {
        let d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
        let div = document.createElement('div');
        div.className = "campo-mes";
        div.innerHTML = `<label>${mesesNomes[d.getMonth()]}/${d.getFullYear()}</label><input type="number" class="mes-consumo" placeholder="0">`;
        gridDiv.appendChild(div);
    }
    document.getElementById('ano').textContent = hoje.getFullYear();

    // 2. TABELA DE PREÇOS COMPLETA (PROTEGIDA)

      5.5: 19679.0, 6.0: 21072.0, 6.5: 22334.0, 7.0: 23520.0, 7.5: 24705.0, 8.0: 25744.0, 8.5: 27115.0,
      9.0: 28530.0, 9.5: 29754.0, 10.0: 31040.0, 10.5: 32487.0, 11.0: 33616.0, 11.5: 34914.0, 12.0: 36096.0,
      12.5: 37600.0, 13.0: 38870.0, 13.5: 40365.0, 14.0: 41720.0, 14.5: 43210.0, 15.0: 44700.0, 15.5: 45911.0,
      16.0: 47392.0, 16.5: 48873.0, 17.0: 50048.0, 17.5: 51345.0, 18.0: 52812.0, 18.5: 54279.0, 19.0: 55746.0,
      19.5: 56862.0, 20.0: 58320.0, 20.5: 59778.0, 21.0: 60648.0, 21.5: 62092.0, 22.0: 63536.0, 22.5: 64980.0,
      23.0: 66424.0, 23.5: 67445.0, 24.0: 68880.0, 24.5: 70315.0, 25.0: 71050.0, 25.5: 72471.0, 26.0: 73892.0,
      26.5: 75313.0, 27.0: 76734.0, 27.5: 77660.0, 28.0: 79072.0, 28.5: 80199.0, 29.0: 81084.0, 29.5: 82482.0,
      30.0: 83880.0, 30.5: 85278.0, 31.0: 86676.0, 31.5: 88074.0, 32.0: 89472.0, 32.5: 90870.0, 33.0: 92268.0,
      33.5: 94001.0, 34.0: 95404.0, 34.5: 96807.0, 35.0: 98210.0, 35.5: 100252.0, 36.0: 101664.0, 36.5: 103076.0,
      37.0: 104488.0, 37.5: 105900.0, 38.0: 107312.0, 38.5: 108724.0, 39.0: 110136.0, 39.5: 111548.0, 40.0: 113360.0,
      40.5: 114777.0, 41.0: 116194.0, 41.5: 117611.0, 42.0: 119028.0, 42.5: 120445.0, 43.0: 121862.0, 43.5: 123279.0,
      44.0: 124696.0, 44.5: 126113.0, 45.0: 128340.0, 45.5: 129766.0, 46.0: 131192.0, 46.5: 132618.0, 47.0: 134514.0,

    };

    // 3. FUNÇÃO PRINCIPAL DE CÁLCULO
    function _calcZN() {
        const inputs = document.querySelectorAll('.mes-consumo');
        let total = 0, qtd = 0;
        inputs.forEach(i => { const v = parseFloat(i.value); if(!isNaN(v) && v > 0){ total += v; qtd++; } });
        
        if(qtd === 0) { alert("Por favor, preencha o consumo de pelo menos um mês."); return; }
        
        const media = total / qtd;
        const nModulos = Math.ceil((media * 1.18) / 55.42);
        const pb = nModulos * 0.575;
        
        // Regra de Arredondamento solicitada: 2.4 -> 2 | 2.5 -> 2.5 | 2.51 -> 3
        let pf;
        if (pb < 2.5) pf = 2.0;
        else if (pb === 2.5) pf = 2.5;
        else pf = Math.ceil(pb);
        
        if (pf > 75.0) pf = 75.0;

        const gastoAtual = media * 0.92954;
        const economia = gastoAtual - 55.87;
        const preco = _0xtp[pf.toFixed(1)] || _0xtp[pf];
        const payback = (preco / (economia * 12)).toFixed(1);

        const res = document.getElementById('resultado-simulacao');
        res.style.display = "block";
        res.innerHTML = `
            <div id="pdf-area" style="background:white; padding:25px; border:1px solid #ddd; text-align:left;">
                <div style="text-align:center; border-bottom:3px solid #ff9800; margin-bottom:20px; padding-bottom:10px;">
                    <h2 style="color:#ff9800; margin:0;">PROPOSTA PRELIMINAR ZNSOLAR</h2>
                    <p style="font-weight:bold; color:#555;">SOLUÇÕES EM ENERGIA FOTOVOLTAICA</p>
                </div>

                <div style="font-size:1.1rem; line-height:1.8;">
                    <p><strong>Consumo Médio Apurado:</strong> ${media.toFixed(1)} kWh/mês</p>
                    <p><strong>Gasto Mensal Atual (Estimado):</strong> R$ ${gastoAtual.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                    <p style="color:#2e7d32;"><strong>Economia Mensal Estimada: R$ ${economia.toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong></p>
                    <p style="font-size:1.3rem; color:#ff9800;"><strong>Investimento Total: R$ ${preco.toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong></p>
                    <p><strong>Retorno do Investimento (Payback):</strong> ${payback} anos</p>
                </div>
                
                <div style="display:flex; flex-direction:column; gap:20px; margin:25px 0;">
                    <div style="height:250px;"><canvas id="chart1"></canvas></div>
                    <div style="height:180px;"><canvas id="chart2"></canvas></div>
                </div>

                <div class="aviso-importante-caixa">
                    <strong>AVISOS IMPORTANTES E OBSERVAÇÕES:</strong><br><br>
                    O VALOR ACIMA É UM PACOTE QUE INCLUI TODOS OS EQUIPAMENTOS NECESSÁRIOS, TODA A INSTALAÇÃO PROFISSIONAL E A HOMOLOGAÇÃO TÉCNICA JUNTO À REDE ELÉTRICA. FOI UTILIZADO PARA ESTE CÁLCULO O HSP DA CIDADE DE SÃO PAULO E A TARIFA DA ENEL SÃO PAULO VIGENTE NO MÊS DE MAIO DE 2026. OS VALORES ESTÃO SUJEITOS A ALTERAÇÕES SEM PRÉVIO AVISO.<br><br>
                    <strong>Aviso Técnico:</strong> ESTE ORÇAMENTO E SIMULAÇÃO SÃO VÁLIDOS PARA SÃO PAULO CAPITAL. UMA VISITA TÉCNICA NO VALOR DE R$ 150,00 É NECESSÁRIA PARA EFETIVAR O ORÇAMENTO E AS CONDIÇÕES DO LOCAL. CIDADES FORA DE SÃO PAULO CAPITAL ESTÃO SUJEITAS A DIFERENÇAS NOS VALORES DE SIMULAÇÃO E CUSTO, SERÁ ACRESCIDO CUSTOS EXTRAS DE DESLOCAMENTO, PEDÁGIOS E OUTROS QUE FOREM NECESSÁRIOS.<br><br>
                    <strong>Nossa Política:</strong> NOSSO SISTEMA É SEM PEGADINHAS. CLAREZA E RAPIDEZ NAS INFORMAÇÕES TORNAM MAIS EFICAZ SUA DECISÃO. SE VOCÊ COMPARTILHA DESTE PENSAMENTO, ENTRE EM CONTATO AGORA MESMO.<br><br>
                    <strong>ZNSOLAR - CONTATO: (11) 98318-5337</strong>
                </div>
            </div>
            <button onclick="baixarPDF()" style="background:#d32f2f; color:white; border:none; padding:18px; width:100%; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:20px; font-size:1.1rem;">
                <i class="fas fa-file-pdf"></i> BAIXAR PROPOSTA EM PDF
            </button>
        `;

        // Renderizar Gráficos
        renderizarGraficos(media, nModulos, gastoAtual);
    }

    function renderizarGraficos(media, n, gasto) {
        const ctx1 = document.getElementById('chart1').getContext('2d');
        new Chart(ctx1, { 
            type:'bar', 
            data:{ 
                labels:['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'], 
                datasets:[{label:'Geração Estimada (kWh)', data:Array(12).fill(media * 1.05), backgroundColor:'#2e7d32'}] 
            }, 
            options:{maintainAspectRatio:false, plugins:{title:{display:true, text:'Geração Solar Mensal'}}} 
        });

        const ctx2 = document.getElementById('chart2').getContext('2d');
        new Chart(ctx2, { 
            type:'bar', 
            data:{ 
                labels:['Gasto Atual', 'Com ZNSOLAR'], 
                datasets:[{data:[gasto, 55.87], backgroundColor:['#e53935','#2e7d32']}] 
            }, 
            options:{indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}, title:{display:true, text:'Comparativo de Conta Mensal (R$)'}}} 
        });
    }

    async function baixarPDF() {
        const { jsPDF } = window.jspdf;
        const area = document.getElementById('pdf-area');
        html2canvas(area, { scale: 2, useCORS: true }).then(canvas => {
            const img = canvas.toDataURL('image/png');
            const doc = new jsPDF('p', 'mm', 'a4');
            const width = doc.internal.pageSize.getWidth();
            doc.addImage(img, 'PNG', 5, 5, width - 10, (canvas.height * (width - 10)) / canvas.width);
            doc.save("Proposta_ZNSOLAR.pdf");
        });
    }

    // PROTEÇÃO CONTRA INSPEÇÃO
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = (e) => { if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) return false; };
</script>

</body>
</html>
